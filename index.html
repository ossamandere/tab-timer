<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="theme-toggle">
        <label class="toggle-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="timer-container">
        <div class="controls">
            <button id="start-pause-btn" class="control-btn">Start</button>
            <button id="restart-btn" class="control-btn secondary-btn" style="display: none;">Restart</button>
            <button id="clear-btn" class="control-btn secondary-btn" style="display: none;">Clear</button>
        </div>
        <div class="timer-display">
            <span class="digit-group" data-group="hours" tabindex="0">00</span>
            <span class="separator">:</span>
            <span class="digit-group" data-group="minutes" tabindex="0">00</span>
            <span class="separator">:</span>
            <span class="digit-group" data-group="seconds" tabindex="0">00</span>
        </div>
        <input type="tel" id="hidden-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-hidden="true">
    </div>

    <audio id="gong-sound" preload="auto">
        <source src="735845__logicogonist__french-gong.wav" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
